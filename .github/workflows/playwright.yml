name: Playwright Tests

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  repair:
    name: Codex CI repair
    needs: test
    if: >-
      ${{ failure()
        && github.event_name == 'push'
        && github.actor != 'github-actions[bot]'
        && !startsWith(github.ref_name, 'codex/ci-fix-') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out failing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Capture the failing test output
        continue-on-error: true
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set -o pipefail
          bunx playwright test --project=chromium 2>&1 | tee ci-playwright.log

      - name: Ask Codex to repair the failure
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            The Playwright CI job failed for the checked-out commit.

            Read ci-playwright.log and any files under test-results/ to diagnose
            the failure. Make the smallest justified code or test fix.

            Requirements:
            - Do not edit files under .github/workflows/.
            - Do not disable, skip, delete, or weaken tests to make CI pass.
            - Do not expose or print credentials, tokens, or environment values.
            - Preserve unrelated changes and existing behavior.
            - Run TypeScript checks and the relevant tests when feasible.
            - Leave the finished changes uncommitted for the workflow to review.
            - If the failure is external, flaky, or cannot be fixed safely, make
              no changes and explain why in your final message.

      - name: Verify Codex changes
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          rm -f ci-playwright.log
          if git status --porcelain -- .github/workflows/ | grep -q .; then
            echo "Codex changed a workflow file; refusing to continue."
            exit 1
          fi
          git diff --check
          bunx playwright test --project=chromium

      - name: Open repair pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          REVIEWER: ${{ github.actor }}
          FIX_BRANCH: codex/ci-fix-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if test -z "$(git status --porcelain)"; then
            echo "Codex did not produce a code change; no pull request will be opened."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$FIX_BRANCH"
          git add -A
          git -c core.hooksPath=/dev/null commit -m "fix: repair failing Playwright tests"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$FIX_BRANCH"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$FIX_BRANCH" \
            --title "fix: repair failing Playwright tests" \
            --body "Automated Codex repair for the failed [Playwright workflow run]($RUN_URL). The repaired test suite passed before this PR was opened. Please review before merging." \
            --reviewer "$REVIEWER"
